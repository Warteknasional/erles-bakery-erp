services:
  db:
    image: postgres:16-alpine
    container_name: erles_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: erles_bakery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erles_bakery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erles_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: erles_bakery
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      QUEUE_CONNECTION: database
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erles_queue_worker
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: erles_bakery
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      QUEUE_CONNECTION: database
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=30

  waha:
    image: devlikeapro/waha
    container_name: erles_waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_API_HOSTNAME: 0.0.0.0
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_NO_PASSWORD: "True"
      WHATSAPP_HOOK_URL: http://backend:8000/api/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_SECRET:-}
    volumes:
      - waha_sessions:/app/.sessions

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: erles_admin
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

  public:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: erles_public
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "5173:5173"
    volumes:
      - ./public:/app
      - public_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  backend_vendor:
  admin_node_modules:
  public_node_modules:
  waha_sessions:
