services:
  db:
    image: postgres:16-alpine
    container_name: erles_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: erles_bakery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erles_bakery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erles_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: erles_bakery
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: erles_admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

  public:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: erles_public
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./public:/app
      - public_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  backend_vendor:
  admin_node_modules:
  public_node_modules:
