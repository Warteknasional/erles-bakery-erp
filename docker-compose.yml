services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erles_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: erles_admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5174

  public:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: erles_public
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./public:/app
      - public_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  backend_vendor:
  admin_node_modules:
  public_node_modules:
